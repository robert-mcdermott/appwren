# AppWren deployment settings.
#
# This file describes how the server runs. Everything about the portfolio program itself
# (vocabularies, fields, questions, the scoring model) is set in the app, under Admin, and is
# stored in the database. So is the product's appearance (name, logo, colors), unless the
# optional [branding] section at the end of this file fixes it.
#
# Any value here can be overridden by an environment variable named APPWREN_<SECTION>_<KEY>,
# for example APPWREN_SERVER_PORT=8080; [branding] is read from this file only. A misspelled
# variable is ignored without a word, so check its name. Secrets are never written in this
# file: where one is needed, the file names the environment variable that holds it.
#
# Relative paths are resolved against this file's own directory.

[server]
# The address and port the web server listens on. Keep 127.0.0.1 when a reverse proxy on the
# same machine terminates TLS; use 0.0.0.0 only behind one.
host = "127.0.0.1"
port = 8000

# How many server processes to run. One is enough for SQLite and small teams.
workers = 1

# The public address people use to reach AppWren, such as "https://appwren.example.org",
# with no path. Used for links in email and for single sign-on's redirect address. Left
# empty, email goes without links, and single sign-on uses the address of each request.
base_url = ""

# A sign-in ends after this long without activity, and after this long in any case.
session_idle_hours = 12
session_max_days = 7

# Run scheduled work (what is due, reminders, email, webhooks) inside this server. Leave it
# on unless you run `appwren jobs run` from a scheduled task instead.
scheduler = true

# The proxies whose X-Forwarded-For and X-Forwarded-Proto are believed, separated by commas,
# or "*" for any. Leave it as it is when the proxy is on this machine. The proxy must replace
# X-Forwarded-For with the address it saw: sign-in attempts are limited by that address.
trusted_proxies = "127.0.0.1"

[database]
# Leave empty to use SQLite, in a single file inside the data home.
# For PostgreSQL: "postgresql+psycopg://appwren@db.example.org:5432/appwren", with the
# password in the PGPASSWORD environment variable (or set the whole address, password and
# all, in APPWREN_DATABASE_URL). PostgreSQL needs the optional driver: uv sync --extra postgres
url = ""

[data]
# The data home: uploaded logos, attachments, exports, logs, and the SQLite database. Keep
# it from other accounts on the machine: chmod 700 it once `appwren init` has made it.
home = "var"

[sso]
# Single sign-on is optional. Out of the box people sign in with an email address and a
# password held by AppWren, and nothing here needs to be set.
#
# To let people sign in with your organization's identity provider as well, name its issuer
# and the client (application) ID it gave AppWren. Any OpenID Connect provider works. For
# Microsoft Entra ID the issuer is "https://login.microsoftonline.com/<tenant id>/v2.0".
# Give the provider this redirect address: <base_url>/api/v1/sso/callback
issuer = ""
client_id = ""

# The client secret is never written in this file. Put it in the environment variable named
# here.
client_secret_env = "APPWREN_SSO_CLIENT_SECRET"

# What AppWren asks the provider for.
scopes = "openid profile email"

# The claim in the ID token that lists a person's application roles or groups. Which value
# gives which role is set in the app, under Admin, Single sign-on. Entra ID sends application
# roles as "roles" and groups as "groups".
roles_claim = "roles"

# The words on the sign-in button.
label = "Sign in with your organization account"

# Accept the provider's address for a person without its saying the address is verified.
# Entra ID does not say, so set this to true for a single Entra ID tenant.
trust_email = false

# Make an account the first time someone signs in. With false, only people who already have
# an account here can sign in.
create_accounts = true

# Keep the password form for everyone who has a password. With false, only administrators
# may sign in with a password, so that there is always a way in.
local_sign_in = true

[mail]
# Email is optional. Without it, notices and reminders are read in the app, under the bell.
#
# To send them by email as well, name an SMTP server and the address they come from. Each
# person then chooses, under Your account, to get each notice as it happens, one summary a
# day, or none.
host = ""
port = 587

# "starttls" (the usual choice on port 587), "tls" (port 465), or "none".
security = "starttls"

# The account to sign in to the mail server with, if it needs one. The password is never
# written in this file. Put it in the environment variable named here.
username = ""
password_env = "APPWREN_MAIL_PASSWORD"

# Who the messages come from.
from_address = ""
from_name = ""

# The hour of the day, in UTC, after which daily summaries are sent.
digest_hour = 7

# [assistant]
# An assistant that drafts records and answers questions is optional, and off until a model
# is named. Without one it is not mentioned anywhere in the app. The key, if the model's
# server needs one, goes in the environment variable key_env names, never in this file.
#
# provider = "openai"                     # the protocol: openai, anthropic, or bedrock
# url = "https://models.example.org/v1"   # needed for openai; https unless on this machine
# model = "a-model-name"
# key_env = "APPWREN_ASSISTANT_KEY"
# roles = ["manager", "architect"]        # who may use it; none named: everyone
# daily_limit = 100                       # questions per person per day; 0: no limit
# keep_days = 365                         # how long an exchange's words are kept; 0: kept
# max_data_class = "internal"             # the most sensitive data it may be told about

# [branding]
# Optional. Fixes the product's look here instead of under Admin, Appearance; what is set
# here wins over the app. Image paths are relative to this file's folder. Every key, and
# exact colors by day and after dark, are in docs/configuration.md.
#
# product_name = "Lantern"
# organization_name = "Example Institute"
# logo_light = "brand/logo.svg"
