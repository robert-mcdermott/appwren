[project]
name = "appwren"
version = "0.3.0"
description = "An open system of record for application portfolio management: know every application, who answers for it, and what to do with it."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "The AppWren Authors" }]
requires-python = ">=3.12"
keywords = ["application portfolio management", "APM", "inventory", "technology lifecycle", "research software", "research"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "sqlalchemy>=2.1.8",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.3.8"]

[project.scripts]
appwren = "appwren.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "C4", "PTH", "S"]
ignore = [
    "S101",  # assert is fine in tests and invariants
    "S603",  # subprocess calls use fixed argument lists
    "S607",  # git is resolved from PATH on purpose
]

[tool.ruff.lint.per-file-ignores]
# The default program is tables of words, kept one entry to a line.
"scripts/build-default-program.py" = ["E501"]
"tests/**" = ["S104", "S105", "S106", "S108", "S311", "S608"]
# The demo organization is invented with a seeded generator.
"src/appwren/demo/**" = ["S311"]
# Its content is tables of words and numbers, kept one entry to a line.
"src/appwren/demo/content.py" = ["E501", "S311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "postgres: needs APPWREN_TEST_POSTGRES_URL (see CONTRIBUTING.md)",
    "sqlite_only: about the SQLite database file, so skipped when the suite runs on PostgreSQL",
]
filterwarnings = [
    "error::DeprecationWarning:appwren.*",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
