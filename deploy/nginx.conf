# AppWren behind nginx. Replace apps.example.org and the certificate paths with yours.

server {
    listen 80;
    server_name apps.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name apps.example.org;

    ssl_certificate     /etc/ssl/certs/apps.example.org.pem;
    ssl_certificate_key /etc/ssl/private/apps.example.org.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 33m;   # AppWren refuses anything over 32 MB itself

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The address nginx itself saw, replacing whatever the client sent. Appending to the
        # client's header would let anyone pick the address their sign-in attempts count against.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }
}
